name = "dongbiz-worker"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# 정적 프론트엔드 (public/index.html). /api/* 외 요청은 여기서 자동으로 서빙됨.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 Database Bindings
# 실행 전 필요: npx wrangler d1 create dongbiz-db  (Cloudflare 로그인 필요)
# 결과로 나온 database_id를 아래에 채울 것. 스키마 적용: npx wrangler d1 execute dongbiz-db --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "dongbiz-db"
database_id = "fb4d0641-f7c9-4060-938a-d3acf3de95e0"

# KV Cache Bindings (§3.4 캐시 정책: placeId 24h, keyword 6h)
[[kv_namespaces]]
binding = "CACHE"
id = "4063e07d64ba4db4a7e8ff6195e6735b"

# 자동 수집 일시 중지(2026-09-12): 네이버 요청 제한 완화 전까지 고정 키워드,
# 사용자 검색 재수집, pcmap 목록, 워치리스트, 텍스트 수집 및 백세보리밥 헬스체크를 실행하지 않는다.
# 고객이 직접 실행하는 Step 1/2 요청은 이 설정과 별개로 유지한다.
[triggers]
crons = ["0 6 * * *"]

# 텔레그램/구글시트 알림 시크릿 (§8.2-A). 값은 git에 올리지 않는다.
# 배포: npx wrangler secret put TELEGRAM_BOT_TOKEN  (TELEGRAM_CHAT_ID, SHEETS_WEBHOOK_URL도 동일)
# 로컬: worker/.dev.vars 파일에 TELEGRAM_BOT_TOKEN=... 형태로 작성 (.gitignore 처리됨)
# 미설정 시 알림 없이 조용히 동작 — 기능에는 영향 없음

# 관리자 화면(/admin) Basic Auth 시크릿. 배포: npx wrangler secret put ADMIN_USER (ADMIN_PASS도 동일)
# 미설정 시 /admin/* 전체가 503으로 막힘 (구멍 방지 — 인증 없이 열리는 것보다 안전)
